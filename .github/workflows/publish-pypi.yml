name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release validation"]
    types: [completed]

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.workflow_run.head_branch }}

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    if: >-
      github.event_name == 'release' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine && python -m pip install -e ".[dev,docs]"

      - name: Verify release tag matches package version
        run: >-
          python tools/check_release_version.py
          --tag "${{ env.RELEASE_TAG }}"

      - name: Run release quality gates
        run: |
          ruff format --check .
          ruff check .
          mypy src
          python -m validate_pyproject pyproject.toml
          python tools/check_schemas.py
          python tools/check_golden.py > golden-status.json
          qresaudit benchmark
          python -m pip_audit .
          python -m bandit -r src -q -s B105,B110,B112
          pytest tests/unit tests/offline_integration tests/physics
          mkdocs build --strict

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the wheel
        run: python tools/smoke_wheel.py

      - name: Store verified distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Store scientific evidence status
        uses: actions/upload-artifact@v5
        with:
          name: scientific-evidence-status
          path: golden-status.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qresaudit
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
