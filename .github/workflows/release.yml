name: Release validation

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,docs]"
      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/check_release_version.py --tag "${{ github.ref_name }}"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python -m validate_pyproject pyproject.toml
      - run: pytest tests/unit tests/offline_integration tests/physics
      - run: qresaudit benchmark --output analytical-benchmarks.json
      - run: python tools/check_golden.py > golden-status.json
      - run: python -m pip_audit .
      - run: python -m pip_audit . --format cyclonedx-json --output sbom.cdx.json
      - run: python -m bandit -r src -q -s B105,B110,B112
      - run: mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/smoke_wheel.py
      - uses: actions/upload-artifact@v6
        with:
          name: release-validation-artifacts
          path: |
            analytical-benchmarks.json
            golden-status.json
            sbom.cdx.json
            dist/*
          if-no-files-found: error
      - name: Publish verified GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --verify-tag
          --title "QResAudit ${{ github.ref_name }}"
          --notes-file docs/release-notes-v2.0.0.md
