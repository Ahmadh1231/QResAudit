name: core-ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m build
      - run: python tools/smoke_wheel.py
      - run: ruff check .
      - run: mypy src
      - run: python tools/check_schemas.py
      - run: python -m validate_pyproject pyproject.toml
      - run: python tools/check_golden.py
      - run: qresaudit benchmark
      - run: python -m pip_audit .
      - run: python -m bandit -r src -q -s B105,B110,B112
      - name: Diagnostic imports
        shell: bash
        run: |
          python -c "import qresaudit; print('core OK:', qresaudit.__version__)"
          python -c "import qresaudit.analysis; print('analysis OK')"
          python -c "from qresaudit.validation import validate_bundle; print('validation OK')"
          python -c "from qresaudit.models.v0_2 import ModeOverlapResult; print('ModeOverlapResult OK')"
      - run: >-
          pytest tests/unit tests/offline_integration tests/physics -vv -ra --tb=long
          --junitxml=junit.xml
          --cov=qresaudit
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=60
      - name: Publish pytest failure summary
        if: failure()
        run: python tools/summarize_junit.py junit.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
            dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
