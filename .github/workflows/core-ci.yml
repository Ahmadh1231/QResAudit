name: core-ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m build
      - run: python tools/smoke_wheel.py
      - run: ruff check .
      - run: mypy src
      - run: python tools/check_schemas.py
      - run: >-
          pytest tests/unit tests/offline_integration
          --junitxml=junit.xml
          --cov=qresaudit
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
            dist/*
