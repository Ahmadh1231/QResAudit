[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qresaudit"
version = "0.2.0"
description = "Portable extraction and offline validation of solved Ansys HFSS results"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ahmadh Hassan" }]
dependencies = [
  "pydantic>=2.13.4,<2.14",
  "numpy>=2.0",
  "pandas>=2.2",
  "h5py>=3.16",
  "scikit-rf>=1.8",
  "scipy>=1.12",
  "typer>=0.16",
  "rich>=14",
  "PyYAML>=6.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
hfss = ["pyaedt>=1.3,<2"]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=6",
  "hypothesis>=6",
  "ruff>=0.12",
  "mypy>=1.16",
]

[project.scripts]
qresaudit = "qresaudit.cli:app"
qresaudit-hfss = "qresaudit_hfss.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qresaudit", "src/qresaudit_hfss"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "qresaudit/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hfss: requires Ansys AEDT and a license"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
no_implicit_reexport = false
disallow_untyped_defs = false
packages = ["qresaudit", "qresaudit_hfss"]

[[tool.mypy.overrides]]
module = ["ansys.aedt.*", "h5py.*", "pandas.*", "scipy.*", "skrf.*", "yaml.*"]
ignore_missing_imports = true
